# personal.conf —— 个人开发机的缓存级配置
#
# 放到 ~/.config/ccache/ccache.conf（ccache 找配置文件的顺序见 ../02-configuration.md）。
# 检查：CCACHE_CONFIGPATH=<本文件> ccache -p，本文件写的每一项右侧括号里都应显示本文件路径；
#       或者直接跑 ./check.sh。
# 核对版本：ccache 4.13.6、4.14。

# 缓存上限。默认 5GiB，大型 C++ 工程（例如 LLVM）远远不够：先设大，再按 `ccache -s` 里
# Cache size 的实际占用回调。后缀 kB/MB/GB/TB 是十进制，KiB/MiB/GiB/TiB 是二进制，不写后缀即 GiB。
max_size = 50GiB

# 缓存目录。默认 ~/.cache/ccache（Linux、没有遗留的 ~/.ccache、没设 XDG_CACHE_HOME 时）。
# 家目录所在的盘紧张就挪走：
# cache_dir = /data/ccache

# 同一份代码有多个 checkout / worktree 时，把它们的共同上级设为 base_dir，
# 命令行里落在其下的绝对路径会先改写成相对路径再算键，于是可以互相命中（../examples/03-cross-dir）。
# 副作用：编译器看到的是相对路径，__FILE__ 与 -MD 依赖文件里也会变成相对路径。
# 不要设成 /：那样连系统头文件路径也会被改写，反而更难命中。
# base_dir = /home/me/src

# team-shared.conf —— 一台构建服务器上多个用户共享同一个本地缓存目录
#
# 放到系统级配置 /etc/ccache.conf（所有用户都会读）。
# 目录准备（假设用户都在 devs 组里）：
#   sudo mkdir -p /srv/ccache
#   sudo chgrp devs /srv/ccache            # 缓存目录属于共同的组
#   sudo chmod 2775 /srv/ccache            # 2 = setgid：子目录继承组；775 = 组可写
# 已有缓存补上 setgid：find /srv/ccache -type d -exec chmod g+s {} +
# 核对版本：ccache 4.13.6、4.14（语法经 check.sh 校验；多用户权限行为未在本机多账户下实测）。

cache_dir = /srv/ccache
max_size = 200GiB

# 新建文件与目录的权限掩码：002 让同组用户可写
umask = 002

# 必须保持默认的 false：硬链接让所有用户的目标文件共享同一个 inode 与 mtime，
# 一个人命中会刷新另一个人构建树里文件的 mtime，触发 make 之类的无谓重链接
hard_link = false

# 每个人的代码在各自家目录下，路径不同；以 /home 为基准改写成相对路径才能互相命中
base_dir = /home

# project.ccache.conf —— 目录级配置文件（ccache ≥ 4.13）
#
# 改名为 ccache.conf 放在仓库根目录并提交。ccache 从编译命令的工作目录向上找 ccache.conf，
# 遇到含 .git 的目录（ceiling_markers 默认值）或家目录（ceiling_dirs 默认值）为止。
# 文件必须属于当前用户且不能是所有人可写，否则 ccache 直接报错退出。
#
# 目录级文件里：
#   - max_size、cache_dir、safe_dirs 等根本不允许；
#   - prefix_command、compiler、log_file、remote_storage 等「决定执行什么、写哪里、连哪里」的
#     选项被视为不安全，只在 safe_dirs 列出的目录下才允许；
#   - 写了 ccache 不认识的键会报错（普通配置文件里则被静默忽略）。
# 完整分类见 ../02-configuration.md。核对版本：ccache 4.13.6、4.14。

# 本仓库的条目单独一个命名空间，方便 `ccache --evict-namespace myproject`
namespace = myproject

# 本仓库用了预编译头，按 ccache 手册的要求放宽这两项检查
sloppiness = pch_defines,time_macros

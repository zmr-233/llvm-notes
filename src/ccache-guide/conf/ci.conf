# ci.conf —— CI 作业
#
# 用法：提交进仓库，作业里 export CCACHE_CONFIGPATH=<仓库>/…/ci.conf（设了它就只读这一份配置文件）；
# 或者在作业开头用 `ccache -o <键>=<值>` 逐项写进 $CCACHE_DIR/ccache.conf。
# 整个作业流程（恢复 → 清零 → 构建 → 统计 → 淘汰 → 保存）见 ../examples/10-ci-lifecycle。
# 核对版本：ccache 4.13.6、4.14。

# 缓存目录由 CI 的缓存动作决定存到哪、从哪恢复；这里只管上限。
# 上限要与 CI 缓存配额相称：缓存包太大，上传下载的时间会吃掉命中省下的时间。
max_size = 2GiB

# 工作区路径。GitHub Actions 里是 $GITHUB_WORKSPACE；变量没设时展开为空串，等于不设 base_dir。
# 自托管 runner、不同仓库名的 fork 路径各不相同时，靠它仍能共享命中。
base_dir = ${GITHUB_WORKSPACE}

# 每个作业单独统计：作业结束后 `ccache --show-log-stats` 只看本作业，
# 不受同一缓存目录里并发作业的干扰。
stats_log = ${RUNNER_TEMP}/ccache-stats.log

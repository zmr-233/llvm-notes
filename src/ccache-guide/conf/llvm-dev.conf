# llvm-dev.conf —— 开发 LLVM 这类大型 C++ 工程：多个 worktree、多种构建类型来回切换
#
# 用法同 personal.conf。核对版本：ccache 4.13.6、4.14。

# LLVM 的一次全量构建产生数千个目标文件，每种构建类型（Release / Debug / 带断言）各一份。
# 先给足，再按 `ccache -s` 的实际占用回调。
max_size = 100GiB

# 所有 worktree 的共同上级。配合 CMake + Ninja 使用：Ninja 在构建目录根执行编译命令，
# ccache 改写出的相对路径在依赖文件里仍能被 Ninja 正确解析（../examples/05-cmake 第 F 段实测）。
base_dir = ${HOME}/src/llvm

# 与 LLVM_CCACHE_BUILD 默认传给 ccache 的取值一致（llvm/CMakeLists.txt 里的 LLVM_CCACHE_PARAMS）：
#   pch_defines  用预编译头时放宽对 #define 的检查（ccache 手册要求 PCH 场景开启）
#   time_macros  源码里有 __DATE__/__TIME__ 也照常缓存，代价是这些宏的值取自入缓存那一刻
# 用 GCC 编 LLVM 时，另请 -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON（原因见 ../06-pitfalls.md）。
sloppiness = pch_defines,time_macros

# 本工程的条目单独一个命名空间：以后不再开发它时，`ccache --evict-namespace llvm` 一次清掉，
# 不影响同一缓存目录里其他工程的条目。
namespace = llvm

# 带 -g 的构建（Debug、RelWithDebInfo）要跨 worktree 命中，不要在这里关 hash_dir，
# 而是在 CMake 里加：-DCMAKE_C_FLAGS=-fdebug-prefix-map=<worktree>=. -DCMAKE_CXX_FLAGS=…
# 关 hash_dir 会让调试信息里的编译目录指向别人的 worktree（../examples/03-cross-dir 实测）。

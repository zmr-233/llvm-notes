# remote.conf —— 开发机只读共享 CI 填好的远端缓存
#
# 前提：ccache ≥ 4.13，并装了 HTTP 存储助手 ccache-storage-http（放在 PATH、/usr/libexec
# 或 ccache 同目录下）。https 只有助手支持，内置的 http 实现不支持，且 4.14 已宣布内置实现
# 将在下一个功能版本移除。
# 核对版本：ccache 4.13.6、4.14（语法经 check.sh 校验；远端行为见 ../examples/08-remote-storage，
# 那里用的是本地 HTTP 服务，未连真实的 https 服务）。

# 多行值（4.13+）：以空白开头的行是上一行的续行，合并时用一个空格连接。
# 每个后端 = 一个 URL + 若干属性：
#   read-only                  只读，本机 miss 的结果不写回
#   @bearer-token-file=<文件>   ccache-storage-http 助手的属性：每次请求从文件读 Bearer token
# 先查共享盘（NFS 挂载），再查 HTTP 服务；本地缓存始终最先查
remote_storage =
  file:/mnt/shared/ccache read-only
  https://ccache.example.com/llvm read-only @bearer-token-file=${HOME}/.config/ccache/token
